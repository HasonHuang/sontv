[package]
name = "iptv-proxy"
version = "0.1.0"
edition = "2021"
description = "IPTV Proxy——与目标 v0.8.2 兼容的重实现"
license = "MIT"
publish = false

[[bin]]
name = "iptv-proxy"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
image-webp = "0.2.4"
png = "0.17.16"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
roxmltree = "0.20"
mime_guess = "2"
notify = "8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "brotli", "socks"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
